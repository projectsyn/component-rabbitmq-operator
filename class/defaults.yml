parameters:
  rabbitmq_operator:
    =_metadata:
      multi_tenant: true
    namespace: syn-rabbitmq-operator
    charts:
      rabbitmq-cluster-operator:
        source: https://charts.bitnami.com/bitnami
        version: 3.10.5

    operator:
      helmValues:
        useCertManager: true
        clusterOperator:
          image:
            registry: docker.io
            repository: bitnamilegacy/rabbitmq-cluster-operator
          podSecurityContext:
            enabled: false
          containerSecurityContext:
            enabled: false

        msgTopologyOperator:
          image:
            registry: docker.io
            repository: bitnamilegacy/rmq-messaging-topology-operator
          podSecurityContext:
            enabled: false
          containerSecurityContext:
            enabled: false

        rabbitmqImage:
          registry: docker.io
          repository: bitnamilegacy/rabbitmq

        credentialUpdaterImage:
          registry: docker.io
          repository: bitnamilegacy/rmq-default-credential-updater
    prober:
      enabled: true
      name: rabbitmq-prober
      namespace: rabbitmq
      image: ghcr.io/projectsyn/component-rabbitmq-operator/prober:latest
      secretName: rabbitmq-default-user
      probeInterval: '10'
      metricsPort: 8080
      useTLS: 'true'
      resources:
        requests:
          memory: '64Mi'
          cpu: '50m'
        limits:
          memory: '128Mi'
          cpu: '100m'
      monitoring:
        interval: '10s'
        recordingRulesInterval: '10s'

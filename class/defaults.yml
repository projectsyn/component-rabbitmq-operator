parameters:
  rabbitmq_operator:
    =_metadata:
      multi_tenant: true
    namespace: syn-rabbitmq-operator
    charts:
      rabbitmq-cluster-operator:
        source: https://charts.bitnami.com/bitnami
        version: 3.10.5

    operator:
      helmValues:
        useCertManager: true
        clusterOperator:
          image:
            registry: docker.io
            repository: bitnamilegacy/rabbitmq-cluster-operator
          podSecurityContext:
            enabled: false
          containerSecurityContext:
            enabled: false

        msgTopologyOperator:
          image:
            registry: docker.io
            repository: bitnamilegacy/rmq-messaging-topology-operator
          podSecurityContext:
            enabled: false
          containerSecurityContext:
            enabled: false

        rabbitmqImage:
          registry: docker.io
          repository: bitnamilegacy/rabbitmq

        credentialUpdaterImage:
          registry: docker.io
          repository: bitnamilegacy/rmq-default-credential-updater

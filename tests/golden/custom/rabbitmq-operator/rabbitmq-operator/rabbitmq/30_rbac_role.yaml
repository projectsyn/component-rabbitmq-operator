apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-access
  namespace: rabbitmq
rules:
  - apiGroups:
      - ''
    resources:
      - pods
      - secrets
      - configmaps
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
      - watch

# Overwrite parameters here

parameters:
  rabbitmq_operator:
    prober:
      enabled: true
    rabbitmq:
      replicas: 3
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rabbitmq-test
              topologyKey: kubernetes.io/hostname
      namespaceLabels:
        test.net: true
      tls:
        enabled: true
      rbac:
        enabled: true
      plugins:
        - rabbitmq_shovel
        - rabbitmq_shovel_management

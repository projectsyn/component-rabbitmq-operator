# Overwrite parameters here
applications:
  - cilium
parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-espejote/v0.12.0/lib/espejote.libsonnet
        output_path: vendor/lib/espejote.libsonnet
  rabbitmq_operator:
    prober:
      enabled: true
      alerts:
        enabled: true
    rabbitmq:
      replicas: 3
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rabbitmq-test
              topologyKey: kubernetes.io/hostname
      namespaceLabels:
        test.net: true
      tls:
        enabled: true
      rbac:
        enabled: true
      plugins:
        - rabbitmq_shovel
        - rabbitmq_shovel_management
      service:
        annotations:
          lbipam.cilium.io/ips: 192.0.2.50
      custom_lb_service:
        enabled: true
        loadBalancerClass: io.cilium/l2-announcer
